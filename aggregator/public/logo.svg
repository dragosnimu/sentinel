<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Sentinel">
  <!-- Marca firmei. Fișier servit de la aceeași origine, NU o adresă `data:`
       inline în foaia de stil: politica agregatorului e `img-src 'self'`, fără
       `data:` (vezi `lib/csp.ts`), deci o marcă inlinată în CSS ar fi refuzată
       de browser și n-ar apărea nicăieri — tăcut, fiindcă un fundal lipsă nu
       dă nicio eroare vizibilă.

       Aceeași geometrie stă în `sentinel/web/static/favicon.svg` și în
       `.brand-mark` din `sentinel/web/static/css/sentinel.css`. Trei copii
       fiindcă politicile diferă, nu fiindcă marca diferă;
       `tests/unit/test_design_system.py` le compară și pică dacă una fuge. -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17CBA6"/>
      <stop offset="100%" stop-color="#3275EC"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#g)"/>
  <g fill="white">
    <circle cx="30" cy="35" r="4"/><circle cx="55" cy="25" r="4"/><circle cx="75" cy="40" r="4"/>
    <circle cx="40" cy="55" r="4"/><circle cx="65" cy="60" r="4"/><circle cx="50" cy="78" r="4"/>
  </g>
  <path d="M30 35 L55 25 L75 40 M40 55 L55 25 M40 55 L65 60 L75 40 M40 55 L50 78 L65 60 M30 35 L40 55"
        stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
