# Runtime directory for Sentinel.
#
# /run/sentinel holds the executor's unix socket. The mode matters: the socket
# is the path from unprivileged Sentinel daemons to root, so the directory is
# group-accessible to `sentinel` and nothing else. The executor additionally
# checks SO_PEERCRED on every connection — filesystem permissions are the first
# gate, not the only one.
#
# systemd recreates this on boot, so a reboot cannot leave a stale socket
# behind for something else to bind.

d /run/sentinel 0750 root sentinel -

# Collector cursors, GeoIP database, threat-intel store, install-state markers.
d /var/lib/sentinel 0750 sentinel sentinel -
d /var/lib/sentinel/cursors 0750 sentinel sentinel -
d /var/lib/sentinel/geoip 0750 sentinel sentinel -
d /var/lib/sentinel/intel 0750 sentinel sentinel -

# The watchdog's own state directory — a SIBLING of /var/lib/sentinel, not a
# child of it. sentinel-watchdog.service runs as root with
# CapabilityBoundingSet=CAP_NET_ADMIN only (no CAP_DAC_OVERRIDE /
# CAP_DAC_READ_SEARCH), and that gap was measured on production from 4 Sep
# 2026: every single run logged "[Errno 13] Permission denied", state was
# never written, `web_down_since` reset to `now()` on every pass, and the
# anti-lockout flush for a dead dashboard could mathematically never fire.
#
# The first attempt at a fix put this directory AT
# `/var/lib/sentinel/watchdog`, root:sentinel, reasoning "root owns this
# directory outright, so it can always write regardless of capabilities" —
# which is wrong twice over. Without CAP_DAC_OVERRIDE / CAP_DAC_READ_SEARCH,
# root is an ORDINARY uid for every DAC permission check, including directory
# TRAVERSAL — and ownership of a leaf directory never comes into play if an
# ancestor denies root the `x` bit. `/var/lib/sentinel` is 0750
# sentinel:sentinel: root cannot even `stat` a path underneath it, so a
# root-owned child inside it would still be unreachable. Reproduced in an
# almalinux:9 container with `setpriv --bounding-set=-all`:
# `stat /var/lib/sentinel/watchdog` → Permission denied, regardless of that
# directory's own owner or mode.
#
# The fix is a directory OUTSIDE the sentinel-owned tree, hung directly off
# `/var/lib` (0755 root:root — root can always traverse that). Root:sentinel,
# setgid (leading 2) so every file root creates inside inherits group
# `sentinel`, and the explicit chmod(0640) in `save_state()`
# (sentinel/respond/watchdog.py) leaves a file the selfcheck — which runs as
# `sentinel`, not root — can actually read.
d /var/lib/sentinel-watchdog 2750 root sentinel -

# Restore points. 0700 root: a backup archive of a webroot contains
# wp-config.php, .env files and database dumps — everything a patch was meant
# to protect. The sentinel user does not need to read them; the root executor
# creates and restores them.
d /var/backups/sentinel 0700 root root -

# The executor's own audit chain — a SIBLING of /var/lib/sentinel, not a
# child of it, for the same reason /var/lib/sentinel-watchdog is (see above).
# /var/lib/sentinel is 0750 sentinel:sentinel: `sentinel` owns that parent
# directory and can rename or replace anything directly inside it, including
# a subdirectory the executor then cannot write to or recreate, because its
# capability set omits CAP_DAC_OVERRIDE. That is an argument from the
# permissions, reproduced in a container with a capability-stripped `mkdir`
# (tests/security/test_executor_audit_dir_posix.py) - NOT an outage that was
# observed. Measured on 5 October 2026 on both live hosts: the old chain,
# /var/lib/sentinel/executor/audit.jsonl, exists owned root:root (55.6 MB on
# production, 25.4 MB on n8n) and the current boot logged zero "AUDIT WRITE
# FAILED". 0700 root:root makes the new directory unreachable to `sentinel`
# entirely — not just unwritable, untraversable — so it can neither redirect
# it with a symlink nor delete it to force a silent recreate.
d /var/lib/sentinel-executor 0700 root root -
