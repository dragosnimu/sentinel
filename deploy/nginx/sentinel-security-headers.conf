# Security headers for the Sentinel dashboard.
#
# The Content-Security-Policy below has no 'unsafe-inline' and no external
# origins. That is achievable only because the dashboard is server-rendered
# Jinja2 with vendored HTMX and uPlot — no CDN, no inline scripts, no build
# step. It is the concrete payoff of that choice: an XSS in the dashboard has
# nowhere to load a payload from and nowhere to send data to.
#
# If you ever add a CDN link or an inline <script>, this policy breaks, and the
# correct fix is to vendor the asset rather than to weaken the policy.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

# 1 year, subdomains included. Only meaningful once a real certificate is in
# place; certbot handles that, and this header is what stops an attacker on a
# hostile network from stripping TLS on the next visit.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# Nothing here needs a camera, a microphone, a location or a payment handler.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# Cross-origin isolation: an attacker's page cannot embed, read, or resource-load
# from the dashboard.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
