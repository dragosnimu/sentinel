# Shared proxy parameters for the Sentinel dashboard.
#
# $remote_addr, not $http_x_forwarded_for. nginx talks to the app over loopback
# and is the only thing in front of it, so the peer address IS the client
# address. Trusting a client-supplied X-Forwarded-For here would let an attacker
# forge their own source address in the audit log and in the login rate limiter
# — the two places where getting it wrong matters most.
#
# If a CDN or another reverse proxy is ever placed in front of this, set
# `set_real_ip_from <that proxy's address>` and `real_ip_header X-Forwarded-For`
# in the http block first. Never trust the header without pinning the source.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_http_version 1.1;
proxy_set_header Connection "";

# The proxy_*_timeout defaults live in the server block, NOT here. This file is
# included in every location, including /stream, which needs a much longer
# read timeout for its long-lived SSE connection. A directive declared both in
# this include and in the location that overrides it is a duplicate — nginx
# rejects it outright rather than treating the later one as an override. Keeping
# the defaults at server scope lets /stream override read_timeout cleanly.

# The app never sets these; strip anything an upstream bug might emit rather
# than letting a header from the application override the vhost's policy.
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

# Do not pass an error page from the app straight through — a stack trace in a
# 500 body is an information leak on a security dashboard.
proxy_intercept_errors off;
