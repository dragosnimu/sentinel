# PostgreSQL tuning for a small VPS that is also running something else.
#
# These are deliberately modest. The default RHEL configuration assumes a
# dedicated database host; this one is not. Every megabyte PostgreSQL takes is
# a megabyte the application you are protecting does not have, and the OOM
# killer picking that application manifests as "the site is down" — a bad way
# to learn about memory pressure caused by your monitoring.
#
# Loaded via conf.d, so postgresql.conf itself is untouched and a package
# update will not clobber this.

listen_addresses = '127.0.0.1'
port = 5432

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
# The usual advice is 25% of RAM. That advice assumes a dedicated host.
shared_buffers = 256MB

# A hint to the planner about the OS page cache, not an allocation. Set well
# below what the machine actually has, because the other workloads on this host
# are using most of it.
effective_cache_size = 768MB

# Per sort/hash operation, and several can run per query. Sentinel's heaviest
# queries are the percentile and window-function rollups, which comfortably fit.
work_mem = 8MB

maintenance_work_mem = 64MB

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
# Six daemons with pools of 2-10, plus the skill scripts and psql sessions.
# 40 is generous; raising it costs memory per backend.
max_connections = 40

# ---------------------------------------------------------------------------
# Write-ahead log
# ---------------------------------------------------------------------------
wal_compression = on
# Longer checkpoints mean fewer, larger flushes — gentler on a shared disk than
# frequent small ones competing with Suricata and the application for I/O.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# ---------------------------------------------------------------------------
# Partitioning
# ---------------------------------------------------------------------------
# raw_events, health_samples and capacity_samples are daily-partitioned with
# ~30 days retained, so a query with a ts filter must prune. Without this the
# planner examines every partition and the whole design is pointless.
enable_partition_pruning = on
constraint_exclusion = partition

# ---------------------------------------------------------------------------
# Autovacuum
# ---------------------------------------------------------------------------
# The high-churn tables are the append-only partitioned ones, which are dropped
# rather than vacuumed. The tables that DO churn (actors, incidents, blocklist)
# are small and update-heavy, so vacuum them more eagerly than the default.
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
# Vacuum is housekeeping; it must not compete with ingestion for I/O.
autovacuum_vacuum_cost_delay = 10ms

# ---------------------------------------------------------------------------
# Timeouts
# ---------------------------------------------------------------------------
# A stuck idle transaction holds locks and blocks partition DETACH, which is
# how retention silently stops working. Kill them rather than debug them.
idle_in_transaction_session_timeout = 60s
statement_timeout = 60s
lock_timeout = 10s

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_rotation_age = 1d
log_truncate_on_rotation = on
log_line_prefix = '%m [%p] %q%u@%d '

# Anything slower than this on a database this size is a missing index or a
# query that forgot its ts filter.
log_min_duration_statement = 2000

log_checkpoints = on
log_lock_waits = on
log_temp_files = 8MB
log_autovacuum_min_duration = 5000

# Never log statement text: an INSERT into raw_events contains attacker-supplied
# HTTP paths and user agents, and a Sentinel query can carry a session token.
log_statement = 'ddl'

# ---------------------------------------------------------------------------
# Planner
# ---------------------------------------------------------------------------
# VPS storage is SSD-backed; the default 4.0 assumes spinning disks and pushes
# the planner towards sequential scans it does not need.
random_page_cost = 1.2
effective_io_concurrency = 200

timezone = 'UTC'
