<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sentinel">
  <!-- Inline SVG rather than a PNG: one small file, no raster assets to ship,
       and it stays sharp on any display. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#35c07f"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0f1115"/>
  <path d="M16 5.5 26 9v7.6c0 5.6-4.1 9.4-10 11.4-5.9-2-10-5.8-10-11.4V9l10-3.5Z"
        fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M11.5 16.2 15 19.6l6-6.6" fill="none" stroke="url(#g)"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
